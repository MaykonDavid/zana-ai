<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zana AI</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Fundo com foto de lavoura -->
    <div class="bg-farm"></div>
    <div class="bg-overlay"></div>

    <!-- Container principal -->
    <div class="app-container">

        <!-- Cabeçalho -->
        <header class="header">
            <div class="header-logo">
                <div class="logo-icon">🌾</div>
                <div class="logo-text">
                    <span class="logo-name">Zana AI</span>
                    <span class="logo-sub">Assistente de Decisão Agronômica</span>
                    <div style="display:flex; gap:8px">
    <button onclick="window.location.href='/fazenda'"
        style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
               color:#fff; padding:8px 16px; border-radius:20px; font-size:13px;
               cursor:pointer; font-family:Inter,sans-serif;">
        🏡 Minha Fazenda
    </button>
    <button onclick="logout()"
        style="background:transparent; border:1px solid rgba(255,255,255,0.2);
               color:rgba(255,255,255,0.7); padding:8px 16px; border-radius:20px;
               font-size:13px; cursor:pointer; font-family:Inter,sans-serif;">
        Sair
    </button>
</div>
                </div>
            </div>
            <div class="header-status">
                <span class="status-dot"></span>
                <span class="status-text">Online</span>
            </div>
        </header>

        <!-- Área do chat -->
        <main class="chat-container">

            <!-- Tela de boas-vindas -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="avatar-container">
                    <img src="/static/images/zana-avatar.png"
                         alt="Zana AI"
                         class="avatar"
                         onerror="this.style.display='none'; document.getElementById('avatar-emoji').style.display='flex'">
                    <div class="avatar-emoji" id="avatar-emoji" style="display:none">🧑‍🌾</div>
                </div>
                <h2 class="welcome-title">Olá! Sou a Zana AI</h2>
                <p class="welcome-subtitle">
                    Sua assistente agronômica inteligente.<br>
                    Pergunte sobre seus talhões, riscos de seca, manejo e muito mais.
                </p>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="enviarSugestao(this)">
                        🗺️ Quais talhões temos na fazenda?
                    </button>
                    <button class="suggestion-btn" onclick="enviarSugestao(this)">
                        💧 Existe algum talhão em risco de seca?
                    </button>
                    <button class="suggestion-btn" onclick="enviarSugestao(this)">
                        🌿 Qual a dose de glifosato para soja?
                    </button>
                    <button class="suggestion-btn" onclick="enviarSugestao(this)">
                        🍄 Como controlar a ferrugem na soja?
                    </button>
                </div>
            </div>

            <!-- Mensagens do chat -->
            <div class="messages" id="messages"></div>

        </main>

        <!-- Input -->
        <footer class="input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="input-pergunta"
                    class="input-field"
                    placeholder="Pergunte sobre sua fazenda..."
                    onkeydown="if(event.key==='Enter') enviar()"
                    autofocus
                />
                <button class="send-btn" id="send-btn" onclick="enviar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M22 2L11 13" stroke="white" stroke-width="2" stroke-linecap="round"/>
                        <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <p class="input-hint">Powered by Zana AI • Agronegócio Inteligente</p>
        </footer>

    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
